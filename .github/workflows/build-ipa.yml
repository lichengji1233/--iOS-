name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -e
          xcodebuild -version
          xcodebuild -project LinkSaver.xcodeproj -scheme LinkSaver \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
          echo ">> app build OK"

      - name: Package IPA
        run: |
          set -e
          mkdir -p build/ipa/Payload
          cp -R build/derived/Build/Products/Release-iphoneos/LinkSaver.app build/ipa/Payload/
          cd build/ipa
          zip -qry ../LinkSaver.ipa Payload
          echo ">> ipa package OK"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LinkSaver-ipa
          path: build/LinkSaver.ipa
          if-no-files-found: error
