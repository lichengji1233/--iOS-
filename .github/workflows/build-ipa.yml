name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          set -e
          xcodebuild -project LinkSaver.xcodeproj -scheme LinkSaver \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/LinkSaver.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
          mkdir -p build/ipa/Payload
          cp -R build/LinkSaver.xcarchive/Products/Applications/LinkSaver.app build/ipa/Payload/
          cd build/ipa && zip -qry ../LinkSaver.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LinkSaver-ipa
          path: build/LinkSaver.ipa
          if-no-files-found: error
