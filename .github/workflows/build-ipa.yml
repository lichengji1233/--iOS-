name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -eo pipefail
          xcodebuild -version
          xcodebuild -project LinkSaver.xcodeproj -scheme LinkSaver \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log
          echo ">> app build OK"

      - name: Show build errors (if failed)
        if: failure()
        run: |
          echo "===== 最后 40 行 ====="
          tail -n 40 /tmp/xcodebuild.log
          echo "===== error 行 ====="
          grep -nE "error:|fatal error:|BUILD FAILED|The following build commands failed" /tmp/xcodebuild.log | tail -n 30 || true

      - name: Package IPA
        run: |
          set -e
          mkdir -p build/ipa/Payload
          cp -R build/derived/Build/Products/Release-iphoneos/LinkSaver.app build/ipa/Payload/
          cd build/ipa
          zip -qry ../LinkSaver.ipa Payload
          echo ">> ipa package OK"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LinkSaver-ipa
          path: build/LinkSaver.ipa
          if-no-files-found: error

      - name: Upload build log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: warn
