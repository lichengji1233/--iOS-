workflows:
  ios:
    name: 小帮手小熊猫 iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - brew install xcodegen
      - xcodegen generate
      - xcodebuild -project LinkSaver.xcodeproj -scheme LinkSaver -configuration Release -destination 'generic/platform=iOS' -archivePath build/LinkSaver.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
      - mkdir -p build/ipa/Payload
      - cp -R build/LinkSaver.xcarchive/Products/Applications/LinkSaver.app build/ipa/Payload/
      - cd build/ipa && zip -qry ../LinkSaver.ipa Payload
    artifacts:
      - build/LinkSaver.ipa
